name: Torus Button Bridge
description: "토러스 메모리 게임 — 아케이드 버튼 4개(빨·노·초·파)를 웹앱으로 나르는 브리지 (STM32 MCU → 시리얼 → Python). 웹앱이 ws://localhost:8765 로 붙는다."
icon: 🎮
