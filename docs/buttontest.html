<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>버튼 확인 — 인코더 배선 테스트</title>
<style>
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #1b1b22; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #aaa; margin-bottom: 18px; font-size: 14px; }
  .pads { font-size: 13px; color: #9ad; margin-bottom: 14px; min-height: 1.4em; }
  .seats { display: flex; gap: 40px; flex-wrap: wrap; }
  .seat { flex: 1; min-width: 320px; }
  .seat h2 { font-size: 18px; margin: 0 0 10px; }
  .row { display: flex; gap: 12px; }
  .btn { flex: 1; aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; color: #222; opacity: .35; transition: opacity .05s, transform .05s; border: 4px solid transparent; }
  .btn.on { opacity: 1; transform: scale(1.08); border-color: #fff; box-shadow: 0 0 24px rgba(255,255,255,.6); }
  .btn small { font-weight: normal; font-size: 11px; opacity: .8; }
  .log { margin-top: 22px; font-family: monospace; font-size: 13px; color: #cfc; white-space: pre-wrap; max-height: 40vh; overflow: auto; background: #111; padding: 10px; border-radius: 6px; }
  .raw { color: #fc6; }
</style>
</head>
<body>
<h1>버튼 확인 — 인코더 배선 테스트</h1>
<div class="sub">버튼을 하나씩 누르세요. 불이 들어오는 자리가 맞으면 배선 OK. 다른 자리에 들어오면 그 두 선을 바꿔 꽂으면 됩니다. 키보드 1~5 · Q~T 도 됩니다.</div>
<div class="pads" id="pads">인코더(게임패드)를 찾는 중… USB 에 꽂혀 있으면 아무 버튼이나 한 번 누르세요.</div>
<div class="seats" id="seats"></div>
<div class="log" id="log"></div>
<script type="module">
  import { CONFIG } from '/js/config.js';
  const NAMES = ['빨강', '노랑', '초록', '파랑', '흰색 (도전)'];
  const COLORS = ['#e53935', '#fdd835', '#43a047', '#1e88e5', '#f5f5f5'];
  const seatsEl = document.getElementById('seats'), log = document.getElementById('log'), padsEl = document.getElementById('pads');
  const cells = [];   // cells[seat][button]
  CONFIG.GAMEPAD_MAPS.forEach((map, seat) => {
    const s = document.createElement('div'); s.className = 'seat';
    s.innerHTML = `<h2>책상 ${seat + 1} (${seat === 0 ? '왼쪽 · K1~K5 · 키 1~5' : '오른쪽 · K6~K10 · 키 Q~T'})</h2><div class="row"></div>`;
    const row = s.querySelector('.row'); cells[seat] = [];
    map.forEach((padIdx, b) => {
      const d = document.createElement('div'); d.className = 'btn'; d.style.background = COLORS[b];
      d.innerHTML = `${NAMES[b]}<small>K${padIdx + 1}</small>`; row.append(d); cells[seat][b] = d;
    });
    seatsEl.append(s);
  });
  const lines = []; const say = (t, raw) => { lines.unshift(`${new Date().toLocaleTimeString()}  ${raw ? '<span class="raw">' + t + '</span>' : t}`); if (lines.length > 40) lines.pop(); log.innerHTML = lines.join('\n'); };
  const light = (seat, b, on) => cells[seat]?.[b]?.classList.toggle('on', on);
  // 인코더 → 좌석/버튼
  const where = (idx) => { for (let s = 0; s < CONFIG.GAMEPAD_MAPS.length; s++) { const b = CONFIG.GAMEPAD_MAPS[s].indexOf(idx); if (b >= 0) return [s, b]; } return null; };
  const prev = new Map();
  const poll = () => {
    const pads = [...(navigator.getGamepads?.() ?? [])].filter(Boolean);
    padsEl.textContent = pads.length ? pads.map((p) => `✔ ${p.id} — 버튼 ${p.buttons.length}개`).join('  |  ') : '인코더(게임패드)를 찾는 중… USB 에 꽂혀 있으면 아무 버튼이나 한 번 누르세요.';
    for (const p of pads) {
      const key = p.index; const was = prev.get(key) ?? [];
      p.buttons.forEach((bt, i) => {
        const now = bt.pressed; if (now === !!was[i]) return;
        const w = where(i);
        if (w) { light(w[0], w[1], now); if (now) say(`K${i + 1} → 책상 ${w[0] + 1} ${NAMES[w[1]]}`); }
        else if (now) say(`K${i + 1} (번호 ${i}) — 배정 안 된 입력. 이 번호를 쓰려면 js/config.js 의 GAMEPAD_MAPS 를 고친다`, true);
      });
      prev.set(key, p.buttons.map((b) => b.pressed));
    }
    requestAnimationFrame(poll);
  };
  requestAnimationFrame(poll);
  // 키보드
  const keyWhere = (k) => { for (let s = 0; s < CONFIG.KEY_MAPS.length; s++) { const b = CONFIG.KEY_MAPS[s][k.toLowerCase()]; if (b !== undefined) return [s, b]; } return null; };
  addEventListener('keydown', (e) => { if (e.repeat) return; const w = keyWhere(e.key); if (w) { light(w[0], w[1], true); say(`키 ${e.key} → 책상 ${w[0] + 1} ${NAMES[w[1]]}`); } });
  addEventListener('keyup', (e) => { const w = keyWhere(e.key); if (w) light(w[0], w[1], false); });
</script>
</body>
</html>
