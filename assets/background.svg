<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!--
    배경 그림.

    이 파일을 덮어쓰면 전 화면 배경이 바뀝니다 (코드 수정 불필요).

    주의할 점
    - 1920×1080 기준으로 그리되, 화면 비율이 다르면 'cover'로 잘려 들어간다.
      → 가장자리 10% 안쪽에는 중요한 것을 두지 말 것.
    - 위에 카드·글자·어두운 무대가 올라간다. 배경이 튀면 글씨가 안 읽힌다.
      → 가운데는 되도록 비우고, 대비가 낮은 연한 색으로.
    - preserveAspectRatio="xMidYMid slice" 를 유지하면 어떤 비율에서도 꽉 찬다.
  -->
  <defs>
    <linearGradient id="bg-base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#fff6f2"/>
      <stop offset="100%" stop-color="#f4f0ff"/>
    </linearGradient>

    <radialGradient id="bg-pink" cx="0.12" cy="0.08" r="0.62">
      <stop offset="0%"   stop-color="#ffe8f0"/>
      <stop offset="100%" stop-color="#ffe8f0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bg-blue" cx="0.88" cy="0.14" r="0.6">
      <stop offset="0%"   stop-color="#e6f0ff"/>
      <stop offset="100%" stop-color="#e6f0ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bg-mint" cx="0.5" cy="1" r="0.58">
      <stop offset="0%"   stop-color="#eafaf7"/>
      <stop offset="100%" stop-color="#eafaf7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bg-blob-pink" cx="0.35" cy="0.32" r="0.72">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff8fab"/>
    </radialGradient>

    <radialGradient id="bg-blob-lav" cx="0.35" cy="0.32" r="0.72">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9a7ff"/>
    </radialGradient>
  </defs>

  <!-- 바탕 -->
  <rect width="1920" height="1080" fill="url(#bg-base)"/>
  <rect width="1920" height="1080" fill="url(#bg-pink)"/>
  <rect width="1920" height="1080" fill="url(#bg-blue)"/>
  <rect width="1920" height="1080" fill="url(#bg-mint)"/>

  <!-- 장식 방울 — 가장자리에만 둔다 (가운데는 카드·글자 자리) -->
  <circle cx="150"  cy="860" r="92" fill="url(#bg-blob-pink)" opacity="0.32"/>
  <circle cx="1770" cy="220" r="64" fill="url(#bg-blob-lav)"  opacity="0.32"/>
  <circle cx="1690" cy="920" r="38" fill="url(#bg-blob-pink)" opacity="0.22"/>
  <circle cx="250"  cy="150" r="34" fill="url(#bg-blob-lav)"  opacity="0.22"/>
</svg>
