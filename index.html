<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="토러스와 즐기는 랜덤 메모리 게임 — 색깔·숫자·모양을 차례로 외우는 4버튼 아케이드 기억력 게임">
  <title>토러스와 즐기는 랜덤 메모리 게임</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 좌석(책상)이 이 안에 들어간다. 보통은 하나, 실물 키오스크는 좌우 둘.
       좌석마다 씬이 교체되는 자리(.seat-app)와 상주 요소(.seat-overlay)를 갖는다. -->
  <main id="app" aria-live="polite"></main>

  <!-- 좌석과 무관하게 화면 전체에 하나만 있는 것 (버튼 연결 표시등) -->
  <div id="overlay" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
